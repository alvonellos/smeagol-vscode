<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" version="1.1">
  <defs>
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="#0a0a0a"/>

  <!-- Smeagol's Head -->
  <ellipse cx="128" cy="90" rx="45" ry="50" fill="url(#bodyGradient)" stroke="#404040" stroke-width="2"/>

  <!-- Head Details -->
  <ellipse cx="128" cy="95" rx="40" ry="45" fill="#2a2a2a"/>

  <!-- Left Eye (large, glowing) -->
  <circle cx="110" cy="75" r="8" fill="#00ff00" opacity="0.9" filter="url(#glow)"/>
  <circle cx="110" cy="75" r="5" fill="#00ff88"/>
  <circle cx="112" cy="73" r="2" fill="#ffffff"/>

  <!-- Right Eye (large, glowing) -->
  <circle cx="146" cy="75" r="8" fill="#00ff00" opacity="0.9" filter="url(#glow)"/>
  <circle cx="146" cy="75" r="5" fill="#00ff88"/>
  <circle cx="148" cy="73" r="2" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M 128 95 L 126 105 L 130 105 Z" fill="#1a1a1a" stroke="#303030" stroke-width="1"/>

  <!-- Mouth (grin) -->
  <path d="M 115 110 Q 128 120 141 110" stroke="#303030" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Ears -->
  <ellipse cx="85" cy="70" rx="12" ry="18" fill="#1a1a1a" stroke="#303030" stroke-width="1"/>
  <ellipse cx="171" cy="70" rx="12" ry="18" fill="#1a1a1a" stroke="#303030" stroke-width="1"/>

  <!-- Body/Cloak -->
  <path d="M 90 135 Q 85 160 90 190 Q 95 210 128 215 Q 161 210 166 190 Q 171 160 166 135" 
        fill="url(#bodyGradient)" stroke="#404040" stroke-width="2"/>

  <!-- Code Elements - Left Side -->
  <g opacity="0.7">
    <!-- Bracket: { -->
    <path d="M 35 120 L 40 120 Q 45 120 45 125 L 45 150 Q 45 155 40 155 L 35 155" 
          stroke="#ff00ff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Operator: + -->
    <line x1="48" y1="135" x2="58" y2="135" stroke="#ff00ff" stroke-width="2"/>
    <line x1="53" y1="130" x2="53" y2="140" stroke="#ff00ff" stroke-width="2"/>
    <!-- Arrow: → -->
    <line x1="48" y1="150" x2="58" y2="150" stroke="#00ff00" stroke-width="2"/>
    <polygon points="58,150 52,147 54,150 52,153" fill="#00ff00"/>
  </g>

  <!-- Code Elements - Right Side -->
  <g opacity="0.7">
    <!-- Function: λ -->
    <path d="M 215 125 L 225 145 L 235 125" stroke="#00ffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Operator: ⊕ (XOR/circular plus) -->
    <circle cx="220" cy="160" r="6" stroke="#ff6600" stroke-width="2" fill="none"/>
    <line x1="217" y1="160" x2="223" y2="160" stroke="#ff6600" stroke-width="1.5"/>
    <line x1="220" y1="157" x2="220" y2="163" stroke="#ff6600" stroke-width="1.5"/>
  </g>

  <!-- Central Code Pattern (precious code) -->
  <g opacity="0.5" transform="translate(128, 160)">
    <!-- Function brackets -->
    <text x="-15" y="5" font-family="monospace" font-size="12" fill="#00ff00" font-weight="bold">def</text>
    <text x="0" y="5" font-family="monospace" font-size="12" fill="#ff00ff" font-weight="bold">()</text>
    <text x="12" y="5" font-family="monospace" font-size="12" fill="#00ffff" font-weight="bold">:</text>
  </g>

  <!-- Decorative Glow Around Eyes -->
  <circle cx="110" cy="75" r="12" fill="none" stroke="#00ff00" stroke-width="1" opacity="0.4"/>
  <circle cx="146" cy="75" r="12" fill="none" stroke="#00ff00" stroke-width="1" opacity="0.4"/>

  <!-- Bottom Accent - "The Precious Code" -->
  <rect x="40" y="225" width="176" height="2" fill="#ff00ff" opacity="0.6"/>
  <text x="128" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ff00ff" opacity="0.6">SMEAGOL CODE IDE</text>
</svg>
